{% if fish.photo %}<a class="monthly-fish-photo" href="{% url 'fishinglog:catch_photo' fish.pk %}" aria-label="Avaa saaliskuva: {{ fish.species }}"><img src="{% url 'fishinglog:catch_photo' fish.pk %}" alt="Saaliskuva: {{ fish.species }}" loading="lazy" width="800" height="450"></a>{% endif %}
<div class="monthly-fish-body">
<p class="monthly-fish-rank"><span aria-hidden="true">{% if rank == 1 %}🥇{% elif rank == 2 %}🥈{% else %}🥉{% endif %}</span> {{ rank }}. sija</p>
<h3 class="h5 monthly-fish-species">{{ fish.species }}</h3>
<p class="monthly-fish-measurements"><strong>{{ fish.weight|floatformat:'-3' }} <span class="fs-6">kg</span></strong>{% if fish.length != None %}<span class="text-secondary">{{ fish.length|floatformat:'-3' }} m</span>{% endif %}</p>
<time class="small text-secondary" datetime="{{ fish.date|date:'Y-m-d' }}">{{ fish.date|date:'d.m.Y' }}</time>
</div>
