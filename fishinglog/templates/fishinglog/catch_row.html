<section class="card p-3 p-md-4 mb-3 fish-row" aria-label="Kala {{ number }}">
<div class="d-flex justify-content-between align-items-center gap-2 mb-3">
<h2 class="h5 mb-0 fish-heading">Kala {{ number }}</h2>
<button class="btn btn-outline-danger remove-fish" type="button" aria-label="Poista kala {{ number }} lomakkeelta">Poista kala</button>
</div>
{% if form.errors %}<div class="alert alert-danger" role="alert">Tarkista tämän kalan tiedot.{{ form.non_field_errors }}</div>{% endif %}
<div class="row g-3">
{% for field in form %}
<div class="{% if field.name == 'notes' %}col-12{% else %}col-12 col-md-6{% endif %}">
<label for="{{ field.id_for_label }}" class="form-label fw-semibold">{{ field.label }}{% if field.field.required %} *{% endif %}</label>
{{ field }}
{% if field.help_text %}<div class="form-text" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>{% endif %}
{% if field.errors %}<div class="text-danger small mt-1" id="{{ field.auto_id }}_error">{{ field.errors }}</div>{% endif %}
</div>
{% endfor %}
</div>
</section>
