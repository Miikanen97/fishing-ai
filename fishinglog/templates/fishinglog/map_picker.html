{% load static %}
<div class="col-12">
<h2 class="h5">Tarkka kalastuspaikka</h2>
<p class="small text-secondary">Klikkaa tai napauta karttaa ja siirrä merkkiä vetämällä. Valittu piste tallentuu kalastuspaikaksi ja sitä käytetään ensisijaisesti säähaussa. Kartan keskipiste ei ole valittu paikka.</p>
<div id="fishing-map" data-icon-url="{% static 'fishinglog/leaflet/images/marker-icon.png' %}" data-icon-retina-url="{% static 'fishinglog/leaflet/images/marker-icon-2x.png' %}" data-shadow-url="{% static 'fishinglog/leaflet/images/marker-shadow.png' %}" class="fishing-map" data-editable="true" role="region" aria-label="Valitse kalastuspaikka kartalta"></div>
<div class="d-flex flex-wrap gap-2 mt-2">
<button type="button" id="locate-me" class="btn btn-outline-primary">Käytä nykyistä sijaintiani</button>
<button type="button" id="clear-location" class="btn btn-outline-secondary">Poista tarkka sijainti</button>
</div>
<p id="map-status" role="status" class="small mt-2">Tarkkaa sijaintia ei ole valittu.</p>
<noscript>Kartta tarvitsee JavaScriptin. Voit antaa koordinaatit alla oleviin kenttiin.</noscript>
</div>
