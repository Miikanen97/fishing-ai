{% for row in rows %}<div class="stat-bar mb-2"><div class="d-flex justify-content-between gap-2"><span style="overflow-wrap:anywhere">{{ row.label }}</span><strong>{{ row.count }}</strong></div><div class="progress" style="height:10px" aria-hidden="true"><div class="progress-bar bg-primary" style="width:{{ row.width }}%"></div></div></div>{% empty %}<p class="text-secondary">Ei vielä havaintoja.</p>{% endfor %}
